<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockLife RP - Loading</title>
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0a0f16;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e7eef7;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND LAYERS --- */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('assets/main.png');
            background-size: cover;
            background-position: center;
            /* Processing: Blur, Brightness, Contrast */
            filter: blur(35px) brightness(0.45) contrast(1.2);
            transform: scale(1.1); /* Prevent blurred edges */
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Gradient Mask: Darkens bottom, subtle vignette */
            background: 
                linear-gradient(to bottom, rgba(10, 15, 22, 0.4) 0%, rgba(10, 15, 22, 0.8) 100%),
                radial-gradient(circle at 50% 50%, rgba(58, 161, 255, 0.1) 0%, rgba(10, 15, 22, 0) 60%);
            z-index: 1;
        }

        .bg-noise {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.08;
            mix-blend-mode: soft-light;
            z-index: 2;
            pointer-events: none;
        }

        /* --- NEON ORBS (ANIMATED) --- */
        .orbs-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            mix-blend-mode: screen;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            animation: floatOrb 35s infinite ease-in-out alternate;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #3aa1ff; /* Blue */
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #7c5cff; /* Purple */
            bottom: 10%;
            right: 15%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: #31d0aa; /* Teal */
            top: 60%;
            left: 10%;
            animation-delay: -10s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
            100% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* --- UI LAYER --- */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 60px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-img {
            height: 40px;
            width: 40px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(49, 208, 170, 0.5));
        }

        .branding {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .branding h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #3aa1ff 0%, #7c5cff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(60, 120, 255, 0.3));
        }

        .branding span {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #92a6c0;
            margin-top: 4px;
        }

        /* Center Loader */
        .loader-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* Radar/Ring Loader */
        .radar-loader {
            width: 80px;
            height: 80px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-loader svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .radar-track {
            fill: none;
            stroke: rgba(231, 238, 247, 0.05);
            stroke-width: 1;
        }

        .radar-track-dashed {
            fill: none;
            stroke: rgba(49, 208, 170, 0.2);
            stroke-width: 1;
            stroke-dasharray: 2 4;
        }

        .radar-progress {
            fill: none;
            stroke: #31d0aa;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-dasharray: 180; /* Circumference approx */
            stroke-dashoffset: 180;
            filter: drop-shadow(0 0 6px rgba(49, 208, 170, 0.6));
            animation: radarSpin 2.5s linear infinite;
        }

        .radar-core {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #31d0aa;
            border-radius: 50%;
            box-shadow: 0 0 10px #31d0aa;
            opacity: 0.8;
        }

        @keyframes radarSpin {
            0% { stroke-dashoffset: 180; transform: rotate(0deg); }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -180; transform: rotate(360deg); }
        }

        /* Status Text */
        .status-group {
            text-align: center;
            min-height: 60px; /* Prevent layout shift */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e7eef7;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeText 4s infinite; /* Synced with JS logic */
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .hint-text {
            font-size: 11px;
            color: #5c6b7f;
            margin-top: 8px;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: none;
        }

        @keyframes fadeText {
            0% { opacity: 0; transform: translateY(5px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-5px); }
        }

        /* Footer / Progress Bar */
        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .progress-track {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3aa1ff, #31d0aa);
            box-shadow: 0 0 10px rgba(49, 208, 170, 0.5);
            transition: width 0.3s ease-out;
        }

        .server-info {
            font-size: 10px;
            color: #5c6b7f;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* --- UTILS --- */
        .hidden { display: none; }

    </style>
</head>
<body>

    <!-- Background System -->
    <div class="bg-container">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>
        <div class="bg-noise"></div>
        
        <!-- Soft Neon Orbs -->
        <div class="orbs-container">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <!-- Main UI -->
    <div class="ui-layer">
        
        <!-- Header -->
        <div class="header">
            <img src="assets/logo.png" alt="Logo" class="logo-img" onerror="this.style.opacity=0">
            <div class="branding">
                <h1>BlockLife RP</h1>
                <span>DARK ROLEPLAY</span>
            </div>
        </div>

        <!-- Center Loader & Status -->
        <div class="loader-container">
            <div class="radar-loader">
                <svg viewBox="0 0 80 80">
                    <!-- Outer Ring -->
                    <circle class="radar-track" cx="40" cy="40" r="36"></circle>
                    <!-- Inner Dashed Ring -->
                    <circle class="radar-track-dashed" cx="40" cy="40" r="28"></circle>
                    <!-- Animated Progress Ring -->
                    <circle class="radar-progress" cx="40" cy="40" r="36"></circle>
                </svg>
                <div class="radar-core"></div>
            </div>

            <div class="status-group">
                <div id="status-text" class="status-text">Загрузка ресурсов...</div>
                <div class="hint-text">Пожалуйста, ожидайте инициализации системы</div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="progress-track">
                <div id="progress-bar" class="progress-fill"></div>
            </div>
            <div class="server-info">BlockLife // Secure Connection // v1.0.4</div>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        const statuses = [
            "Загрузка ресурсов...",
            "Компиляция шейдеров...",
            "Инициализация аддонов...",
            "Синхронизация клиента...",
            "Подготовка спавна..."
        ];

        const hint = "Пожалуйста, ожидайте инициализации системы";
        
        // --- LOGIC ---
        const statusEl = document.getElementById('status-text');
        const progressEl = document.getElementById('progress-bar');
        let currentIndex = 0;

        // Simulate GMod Progress (Fake, as HTML doesn't have direct access to GMod download progress without Lua integration)
        // We will animate a smooth progress bar that fills up slowly and loops if loading takes long
        let progress = 0;
        const simulateProgress = () => {
            // Slowly increase progress, capped at 95% (waiting for server confirmation)
            if (progress < 95) {
                progress += Math.random() * 0.5;
                progressEl.style.width = progress + "%";
            }
            requestAnimationFrame(simulateProgress);
        };
        simulateProgress();

        // Status Text Cycle
        function updateStatus() {
            // Fade out
            statusEl.style.animation = 'none';
            statusEl.offsetHeight; /* Trigger reflow */
            
            // Change Text
            statusEl.textContent = statuses[currentIndex];
            
            // Fade In (restart animation)
            statusEl.style.animation = 'fadeText 4s forwards';
            
            // Cycle Index
            currentIndex = (currentIndex + 1) % statuses.length;
        }

        // Start Cycle
        updateStatus(); // Initial call
        setInterval(updateStatus, 4000); // Change every 4 seconds

        // --- GMOD INTEGRATION HOOKS (Placeholders) ---
        // In a real GMod environment, you would call these from Lua
        /*
        function SetProgress(val) {
            progress = val;
            progressEl.style.width = val + "%";
        }
        
        function SetStatus(text) {
            statusEl.textContent = text;
        }
        */
    </script>
</body>
</html>
